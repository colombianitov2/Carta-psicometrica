name: Validar migración de nombre y actualización Beta 4
on:
  workflow_dispatch:
  push:
    branches:
      - 'chatgpt/renombrar-calculadora-refrigeracion-parte-1'
    paths:
      - '.github/rename-validation-request.txt'
permissions:
  contents: read
jobs:
  migration:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Compile and package Beta 4
        shell: pwsh
        run: ./06_Tools/Publicar-FrioCalc-Beta1.ps1 -BetaNumber 4 -OutputDirectory "$env:RUNNER_TEMP\rename-beta4"
      - name: Verify actual Beta 3 portable and installed upgrade
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $previous = Join-Path $env:RUNNER_TEMP 'rename-beta3'
          $next = Join-Path $env:RUNNER_TEMP 'rename-beta4'
          New-Item -ItemType Directory $previous | Out-Null
          gh release download v1.0.0-beta.3 --repo "$env:GITHUB_REPOSITORY" --dir $previous --pattern 'FrioCalc-Beta3-win-x64-*.exe' --pattern 'SHA256SUMS.txt'
          if ($LASTEXITCODE -ne 0) { throw 'No se descargó Beta 3' }
          $manifest = Get-Content (Join-Path $previous 'SHA256SUMS.txt')
          foreach ($item in Get-ChildItem $previous -Filter '*.exe') {
            $match = @($manifest | Where-Object { $_ -match ('^[0-9a-fA-F]{64}  '+[regex]::Escape($item.Name)+'$') })
            if ($match.Count -ne 1 -or (Get-FileHash $item.FullName).Hash.ToLowerInvariant() -ne $match[0].Substring(0,64).ToLowerInvariant()) { throw "SHA-256 incompatible: $item" }
          }
          $oldExe = Join-Path $previous 'FrioCalc-Beta3-win-x64-Portable.exe'
          $newExe = Join-Path $next 'FrioCalc-Beta4-win-x64-Portable.exe'
          $oldIdentity = (Get-Item $oldExe).VersionInfo.ProductName
          $newIdentity = (Get-Item $newExe).VersionInfo.ProductName
          Write-Host "Identidad Beta 3: $oldIdentity; identidad Beta 4: $newIdentity"
          if ($oldIdentity -ne 'FrioCalc.Psychrometrics') { throw 'Identidad de Beta 3 distinta de la prevista' }
          if ($newIdentity -ne 'Calculadora de refrigeración – Parte 1 – Carta psicrométrica') { throw 'Identidad de Beta 4 incorrecta' }
          $target = Join-Path $previous 'upgrade-target.exe'
          Copy-Item $oldExe $target
          $former = Start-Process $target -PassThru
          try {
            Start-Sleep -Seconds 2
            if ($former.HasExited) { throw 'Beta 3 portable no pudo iniciarse' }
            $helper = Start-Process $newExe -ArgumentList @('--apply-portable-update',"$($former.Id)","`"$target`"") -PassThru
            if (!$former.HasExited) { Stop-Process -Id $former.Id }
            if (!$helper.WaitForExit(60000)) { Stop-Process -Id $helper.Id; throw 'Tiempo agotado en actualización cruzada' }
            if ($helper.ExitCode -ne 0) { throw 'Actualización cruzada fallida' }
            if ((Get-FileHash $target).Hash -ne (Get-FileHash $newExe).Hash) { throw 'EXE actualizado incorrecto' }
            $bak = @(Get-ChildItem $previous -Filter 'upgrade-target.exe.previous-*.bak')
            if ($bak.Count -ne 1 -or (Get-FileHash $bak[0].FullName).Hash -ne (Get-FileHash $oldExe).Hash) { throw 'Respaldo de Beta 3 incorrecto' }
            Write-Host 'Beta 3 portable -> Beta 4: respaldo y sustitución verificados.'
          } finally {
            if (!$former.HasExited) { Stop-Process -Id $former.Id }
            Get-Process -Name 'upgrade-target' -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $target } | Stop-Process
          }
          $installDir = Join-Path $env:RUNNER_TEMP 'rename-install'
          $oldSetup = Join-Path $previous 'FrioCalc-Beta3-win-x64-Setup.exe'
          $newSetup = Join-Path $next 'FrioCalc-Beta4-win-x64-Setup.exe'
          $registry = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{BFE39269-7325-4B56-A122-8623E6CD85DF}_is1'
          $installedExe = Join-Path $installDir 'FrioCalc.Psychrometrics.exe'
          try {
            $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=`"$installDir`"")
            $oldInstaller = Start-Process $oldSetup -ArgumentList $args -Wait -PassThru
            if ($oldInstaller.ExitCode -ne 0 -or !(Test-Path $installedExe) -or !(Test-Path $registry)) { throw 'No se instaló Beta 3 correctamente' }
            if ((Get-Item $installedExe).VersionInfo.ProductName -ne $oldIdentity) { throw 'Identidad instalada de Beta 3 incorrecta' }
            $newInstaller = Start-Process $newSetup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -Wait -PassThru
            if ($newInstaller.ExitCode -ne 0 -or !(Test-Path $installedExe) -or !(Test-Path $registry)) { throw 'No se actualizó la instalación de Beta 3' }
            if ((Get-Item $installedExe).VersionInfo.ProductName -ne $newIdentity -or (Get-Item $installedExe).VersionInfo.FileVersion -ne '1.0.0.4') { throw 'La instalación no contiene Beta 4' }
            if ((Get-ItemProperty $registry).DisplayName -notlike 'Calculadora de refrigeración*') { throw 'Nombre de desinstalación incorrecto' }
            Write-Host 'Beta 3 instalada -> Beta 4: misma instalación e identidad nueva verificadas.'
          } finally {
            $uninstaller = Join-Path $installDir 'unins000.exe'
            if (Test-Path $uninstaller) { Start-Process $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait }
          }
      - name: Preserve version bridge packages
        uses: actions/upload-artifact@v4
        with:
          name: Calculadora-refrigeracion-parte1-beta4
          path: |
            ${{ runner.temp }}/rename-beta4/FrioCalc-Beta4-win-x64-*.exe
            ${{ runner.temp }}/rename-beta4/FrioCalc-Beta4-win-x64-Portable.zip
            ${{ runner.temp }}/rename-beta4/SHA256SUMS.txt
          if-no-files-found: error
