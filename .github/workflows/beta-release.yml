name: FrioCalc Beta 2 - Windows x64
on:
  workflow_dispatch:
  push:
    branches:
      - 'chatgpt/friocalc-lista1-2026-11-07'
    paths:
      - '.github/beta-release-request.txt'
permissions:
  contents: write
concurrency:
  group: friocalc-beta-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install installer compiler if absent
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Build, test and package Beta 2
        shell: pwsh
        run: |
          ./06_Tools/Publicar-FrioCalc-Beta1.ps1 -BetaNumber 2 -OutputDirectory "$env:RUNNER_TEMP\friocalc-beta2"
      - name: Preserve release packages
        uses: actions/upload-artifact@v4
        with:
          name: FrioCalc-Beta2-win-x64
          path: |
            ${{ runner.temp }}/friocalc-beta2/FrioCalc-Beta2-win-x64-*.exe
            ${{ runner.temp }}/friocalc-beta2/FrioCalc-Beta2-win-x64-Portable.zip
            ${{ runner.temp }}/friocalc-beta2/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $out = "$env:RUNNER_TEMP\friocalc-beta2"
          gh release create v1.0.0-beta.2 --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "FrioCalc Beta 2" --prerelease --notes "Beta 2 para Windows x64: Buscar actualizaciones en Bibliografía, comprobación SHA-256, respaldo de sesión y tablas de procesos SI/IP. Portable y versión instalable, .NET 10 incluido. Binarios sin firma Authenticode." "$out\FrioCalc-Beta2-win-x64-Portable.exe" "$out\FrioCalc-Beta2-win-x64-Portable.zip" "$out\FrioCalc-Beta2-win-x64-Setup.exe" "$out\SHA256SUMS.txt"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed' }
      - name: Preserve UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friocalc-beta2-ui-snapshots
          path: ui-snapshots
          if-no-files-found: warn
