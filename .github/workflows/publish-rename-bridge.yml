name: Publicar Beta 4 con el nombre oficial
on:
  workflow_dispatch:
  push:
    branches:
      - 'chatgpt/friocalc-lista1-2026-11-07'
    paths:
      - '.github/publish-rename-bridge.txt'
permissions:
  actions: read
  contents: write
concurrency:
  group: friocalc-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm verified Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/44660934596" --jq '.conclusion + " " + .head_sha' | grep -Fx 'success e3abee252f9c2194b8ac626e1888687ea597e865'
          if gh release view v1.0.0-beta.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing release; not overwriting"; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: Calculadora-refrigeracion-parte1-beta4
          run-id: 44660934596
          github-token: ${{ github.token }}
          path: verified
      - name: Check original hashes and prepare new filenames
        shell: bash
        run: |
          set -euo pipefail
          cd verified
          sha256sum --check SHA256SUMS.txt
          cp FrioCalc-Beta4-win-x64-Portable.exe Calculadora-refrigeracion-Parte-1-Carta-psicometrica-Beta4-win-x64-Portable.exe
          cp FrioCalc-Beta4-win-x64-Setup.exe Calculadora-refrigeracion-Parte-1-Carta-psicometrica-Beta4-win-x64-Setup.exe
          zip -q Calculadora-refrigeracion-Parte-1-Carta-psicometrica-Beta4-win-x64-Portable.zip Calculadora-refrigeracion-Parte-1-Carta-psicometrica-Beta4-win-x64-Portable.exe
          sha256sum Calculadora-refrigeracion-Parte-1-Carta-psicometrica-Beta4-win-x64-* >> SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish tested binaries without replacing previous releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd verified
          gh release create v1.0.0-beta.4 --repo "$GITHUB_REPOSITORY" --target e3abee252f9c2194b8ac626e1888687ea597e865 --prerelease \
            --title "Calculadora de refrigeración – Parte 1 – Carta psicrométrica | Beta 4" \
            --notes "Cambio de nombre oficial. Compilación Windows x64 sin errores ni advertencias; 805 pruebas lógicas y 155 de interfaz en cada configuración regional. Validada transición desde Beta 3 portable e instalada, conservando ubicación y respaldo. Los activos con nombres históricos se mantienen exclusivamente para permitir la actualización automática de versiones anteriores. Descarga manual: elige los paquetes Calculadora-refrigeracion-Parte-1. Se mantiene la URL oficial del repositorio para clientes antiguos. .NET 10 incluido; binarios sin firma Authenticode." \
            *.exe *.zip SHA256SUMS.txt
