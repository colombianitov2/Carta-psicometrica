name: FrioCalc WPF Build
on:
  push:
    branches:
      - 'chatgpt/friocalc-lista1-*'
  pull_request:
    branches:
      - 'chatgpt/friocalc-psychrometrics'
  workflow_dispatch:

jobs:
  build:
    name: Build Windows WPF (.NET 10)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore FrioCalc.Psychrometrics.slnx
      - name: Compile with warnings as errors
        run: dotnet build FrioCalc.Psychrometrics.slnx --configuration Debug --no-restore --warnaserror
      - name: Run psychrometric smoke tests
        run: dotnet run --project tests/FrioCalc.Psychrometrics.Smoke/FrioCalc.Psychrometrics.Smoke.csproj --configuration Debug
      - name: Run WPF UI initialization smoke test
        run: dotnet run --project tests/FrioCalc.UI.Smoke/FrioCalc.UI.Smoke.csproj --configuration Debug
